<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 카톡 링크 공유 시 뜨는 제목 -->
  <title>토스 송금 받기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #f2f4f6;
      color: #191f28;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px 28px;
    }
    .top-content {
      margin-top: 40px;
      text-align: left;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background-color: #e8f3ff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #191f28;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 500;
      color: #8b95a1;
      line-height: 1.5;
    }
    .toss-btn {
      width: 100%;
      padding: 18px;
      background-color: #3182f6;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .toss-btn:active {
      transform: scale(0.98);
      background-color: #1b64da;
    }

    /* 버튼 누르면 나오는 동영상 전체화면 */
    #jumpscare-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #jumpscare-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 화면에 빈틈없이 꽉 차게 설정 */
    }
  </style>
</head>
<body>

  <!-- 1. 처음 보이는 토스 송금 화면 -->
  <div class="app-container" id="question-screen">
    <div class="top-content">
      <div class="icon-box">💸</div>
      <h1 class="title">5,000원이 도착했어요<br>지금 바로 받으실래요?</h1>
      <p class="subtitle">수락을 누르면 내 계좌로 바로 입금돼요.<br>수수료는 무료예요.</p>
    </div>
    
    <button class="toss-btn" onclick="triggerScare()">송금 받기</button>
  </div>

  <!-- 2. 버튼 누르면 재생되는 동영상 화면 -->
  <div id="jumpscare-screen">
    <!-- preload="auto"로 영상을 미리 불러와 딜레이 없이 바로 터지게 합니다 -->
    <video id="scary-video" src="scary.mp4" playsinline loop preload="auto"></video>
  </div>

  <script>
    function triggerScare() {
      // 토스 화면 숨기고 영상 화면 띄우기
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('jumpscare-screen').style.display = 'flex';
      
      // 동영상 소리 최대로 켜고 즉시 재생
      const video = document.getElementById('scary-video');
      video.volume = 1.0;
      video.play();

      // 안드로이드 휴대폰 진동 울리기
      if (navigator.vibrate) {
        navigator.vibrate([400, 100, 600]);
      }
    }
  </script>

</body>
</html>
