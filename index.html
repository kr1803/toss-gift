<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>토스 깜짝 선물</title>
  <!-- 토스에서도 사용하는 프리텐다드 폰트 불러오기 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #f2f4f6; /* 토스 배경 그레이 */
      color: #191f28; /* 토스 메인 텍스트 블랙 */
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px 28px;
      position: relative;
    }
    .top-content {
      margin-top: 40px;
      text-align: left;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background-color: #e8f3ff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #191f28;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 500;
      color: #8b95a1; /* 토스 서브 텍스트 그레이 */
      line-height: 1.5;
    }
    /* 토스 특유의 하단 고정 블루 버튼 */
    .toss-btn {
      width: 100%;
      padding: 18px;
      background-color: #3182f6; /* 토스 시그니처 블루 */
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    .toss-btn:active {
      transform: scale(0.98);
      background-color: #1b64da;
    }

    /* 수락 후 나오는 화면 */
    #meme-screen {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      flex-grow: 1;
      animation: fadeInUp 0.4s ease-out forwards;
    }
    .meme-card {
      background-color: #f9fafb;
      border-radius: 24px;
      padding: 16px;
      margin-top: 24px;
      text-align: center;
    }
    .meme-card img {
      width: 100%;
      max-height: 55vh;
      object-fit: cover;
      border-radius: 16px;
    }
    .badge {
      display: inline-block;
      background-color: #e8f3ff;
      color: #3182f6;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. 처음 질문 화면 -->
    <div id="question-screen" style="display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;">
      <div class="top-content">
        <div class="icon-box">🎁</div>
        <h1 class="title">깜짝 선물이 도착했어요<br>지금 바로 받으실래요?</h1>
        <p class="subtitle">수락을 누르면 취소할 수 없어요.<br>수수료는 무료예요.</p>
      </div>
      
      <button class="toss-btn" onclick="acceptGift()">선물 수락하기</button>
    </div>

    <!-- 2. 수락 누르면 나오는 짤 화면 -->
    <div id="meme-screen">
      <div>
        <span class="badge">수령 완료</span>
        <h1 class="title">초코에몽을 받았어요!</h1>
        <p class="subtitle">지금 집 앞 편의점 쪽으로 나와보세요.</p>
        
        <div class="meme-card">
          <!-- 아까 만든 사진 이름을 여기에 넣으세요 -->
          <img src="my_meme.png" alt="초코에몽 짤">
        </div>
      </div>

      <button class="toss-btn" style="margin-top: 20px; background-color: #f2f4f6; color: #4e5968;" onclick="location.reload()">다시 보기</button>
    </div>
  </div>

  <script>
    function acceptGift() {
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('meme-screen').style.display = 'flex';
    }
  </script>

</body>
</html>
